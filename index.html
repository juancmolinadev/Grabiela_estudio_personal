<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Web App</title>
    
    <!-- Todo el diseño está asegurado aquí adentro -->
    <style>
        :root {
            --banner-bg: rgba(28, 28, 30, 0.65);
            --banner-border: rgba(255, 255, 255, 0.15);
            --icon-color: #ff453a;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            background: radial-gradient(circle at 15% 50%, #2a0845, #6441a5, #1e1366);
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .page-content h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .page-content p {
            color: #d1d1d6;
            font-size: 1.2rem;
        }

        /* Diseño del banner estático */
        .apple-banner {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 420px;
            background-color: var(--banner-bg);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border: 0.5px solid var(--banner-border);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            z-index: 9999;
            text-align: left;
        }

        .apple-banner .icon {
            color: var(--icon-color);
            display: flex;
            align-items: center;
            margin-top: 2px;
        }

        .apple-banner .message {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .apple-banner .title {
            font-size: 15px;
            font-weight: 600;
        }

        .apple-banner .description {
            font-size: 13px;
            color: #a1a1a6;
            line-height: 1.4;
        }

        @media (max-width: 480px) {
            .apple-banner {
                width: calc(100% - 32px);
                top: 16px;
                padding: 14px;
                border-radius: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- El banner de error flotante -->
    <div class="apple-banner" role="alert">
        <div class="icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        </div>
        <div class="message">
            <span class="title">Database Error</span>
            <span class="description">Database error due to lack of use, contact support :(</span>
        </div>
    </div>

    <!-- El contenido de la página -->
    <div class="page-content">
        <h1>Movie Web App</h1>
        <p>El código está limpio y el banner funciona correctamente.</p>
    </div>

</body>
</html>
